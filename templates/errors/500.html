{% extends 'base.html' %}

{% block title %}500 - Server Error | ProcureHub UAE{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900 flex flex-col justify-center items-center px-4 text-center">
    <div class="max-w-md bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
        <div class="w-16 h-16 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="server-crash" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-heading font-black text-slate-900">500</h1>
        <h2 class="text-base font-bold text-slate-800 mt-1">Internal Platform Error</h2>
        <p class="text-xs text-slate-500 mt-2">An unexpected error occurred while processing this procurement transaction. Our incident response team has been alerted.</p>
        <div class="mt-6">
            <a href="{% url 'landing' %}" class="inline-flex items-center px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition">
                Return to Home &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
