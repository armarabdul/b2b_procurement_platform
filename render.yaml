services:
  - type: web
    name: procurehub-b2b
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: procurehub-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: procurehub-db
    plan: free
    region: frankfurt
    databaseName: procurehub_db
    user: procurehub_user
